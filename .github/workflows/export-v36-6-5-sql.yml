name: Export v36.6.5 SQL
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/export-v36-6-5-sql.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Build exact staging SQL bundle
        shell: bash
        run: |
          mkdir -p export
          cat supabase/migrations/202608090003_v36_6_5_contract_pricing.sql > export/20260809_APPLY_V36_6_5.sql
          printf '\n\n-- ===== NEXT MIGRATION: immutable-at-creation pricing fix =====\n\n' >> export/20260809_APPLY_V36_6_5.sql
          cat supabase/migrations/202608090004_v36_6_5_pricing_rpc_immutable_fix.sql >> export/20260809_APPLY_V36_6_5.sql
          cp supabase/110_VERIFY_V36_6_5.sql export/110_VERIFY_V36_6_5.sql
          sha256sum export/* > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v36-6-5-staging-sql
          path: export/
          retention-days: 7
