name: Align Phase2 test groups once

on:
  push:
    branches:
      - agent/v36-6-4-phase2-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v36-6-4-phase2-integrity
      - name: Patch canonical group names
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/phase2-integrity-v36-6-4.test.mjs')
          s=p.read_text(encoding='utf-8')
          repl={
            "name:'G1'":"name:'Ρόδου'",
            "name:'G2'":"name:'Ιαλυσού – Καλλιθέας – Αφάντου'",
            "name:'G3'":"name:'Λίνδου – Νότιας Ρόδου – Αρχαγγέλου'",
            "name:'G4'":"name:'Πεταλουδών – Καμείρου – Ατταβύρου'",
          }
          for old,new in repl.items():
              if s.count(old)!=1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/phase2-integrity-v36-6-4.test.mjs
          git commit -m 'test: use canonical Rhodes award group names'
          git push origin HEAD:agent/v36-6-4-phase2-integrity
