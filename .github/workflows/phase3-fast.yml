name: Phase3 isolated test
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/phase3-fast.yml','tests/phase3-financial-v36-6-5.test.mjs','supabase/migrations/**']
jobs:
  phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/phase3-financial-v36-6-5.test.mjs
