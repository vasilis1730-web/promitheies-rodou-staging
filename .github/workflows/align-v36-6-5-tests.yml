name: Align v36.6.5 frontend tests
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/align-v36-6-5-tests.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Align current-version fixtures and assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          simple={
            'tests/award-groups.test.mjs':[("{data:'36.6.4',error:null}","{data:'36.6.5',error:null}")],
            'tests/bulletins-refresh.test.mjs':[("{ data: '36.6.4', error: null }","{ data: '36.6.5', error: null }")],
            'tests/domain-templates.test.mjs':[("{ data: '36.6.4', error: null }","{ data: '36.6.5', error: null }")],
            'tests/empty-service-catalog.test.mjs':[("{ data: '36.6.4', error: null }","{ data: '36.6.5', error: null }")],
            'tests/local-server.test.mjs':[(r"/v36\.6\.4 PHASE 2 INTEGRITY/",r"/v36\.6\.5 CONTRACT PRICING/")],
            'tests/login-bootstrap.test.mjs':[(r"/REQUIRED_SCHEMA_VERSION='36\.6\.4'/",r"/REQUIRED_SCHEMA_VERSION='36\.6\.5'/")]
          }
          for fn,repls in simple.items():
            p=Path(fn); s=p.read_text(encoding='utf-8')
            for old,new in repls:
              if s.count(old)!=1: raise SystemExit(f'{fn}: expected one {old!r}, found {s.count(old)}')
              s=s.replace(old,new)
            p.write_text(s,encoding='utf-8')

          p=Path('tests/step2-frontend.test.mjs'); s=p.read_text(encoding='utf-8')
          repls=[
            ("  'save_contract_atomic',\n","  'save_contract_atomic',\n  'save_contract_pricing_atomic',\n"),
            ("test('το frontend v36.6.4 χρησιμοποιεί διαχείριση μελετών, σταθερές ομάδες, ατομικές ροές και ασφαλή HTML sinks', () => {","test('το frontend v36.6.5 χρησιμοποιεί πραγματικές συμβατικές τιμές, ατομικές ροές και ασφαλή HTML sinks', () => {"),
            (r"assert.match(source, /Προμήθειες &amp; Υπηρεσίες v36\.6\.4 PHASE 2 INTEGRITY/);",r"assert.match(source, /Προμήθειες &amp; Υπηρεσίες v36\.6\.5 CONTRACT PRICING/);"),
            (r"assert.match(source, /const APP_VERSION='v36\.6\.4-phase2-integrity', REQUIRED_SCHEMA_VERSION='36\.6\.4'/);",r"assert.match(source, /const APP_VERSION='v36\.6\.5-contract-pricing', REQUIRED_SCHEMA_VERSION='36\.6\.5'/);")
          ]
          for old,new in repls:
            if s.count(old)!=1: raise SystemExit(f'step2: expected one {old!r}, found {s.count(old)}')
            s=s.replace(old,new)
          anchor="  assert.match(source, /p_import_token:importContext\\.exportToken/);\n"
          addition=(anchor+
            "  assert.match(source, /Οικονομική προσφορά \\/ συμβατικές τιμές/);\n"
            "  assert.match(source, /Συμβατική καθαρή αξία/);\n"
            "  assert.match(source, /Math\\.abs\\(cov-c\\)>0\\.005/);\n"
            "  assert.match(source, /p_pricing_mode:mode/);\n")
          if s.count(anchor)!=1: raise SystemExit(f'step2 anchor count={s.count(anchor)}')
          s=s.replace(anchor,addition)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/award-groups.test.mjs tests/bulletins-refresh.test.mjs tests/domain-templates.test.mjs tests/empty-service-catalog.test.mjs tests/local-server.test.mjs tests/login-bootstrap.test.mjs tests/step2-frontend.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: align frontend fixtures and pricing assertions with v36.6.5"
          git push
