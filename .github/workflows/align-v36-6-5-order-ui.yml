name: Align v36.6.5 order UI
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/align-v36-6-5-order-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Align custom mapping and contract balance wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,hashlib,base64
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          repls=[
            ('el("div",{class:"mo-section-h"},"Υπόλοιπο μελέτης")','el("div",{class:"mo-section-h"},"Υπόλοιπο σύμβασης")'),
            ('"Καθαρή αξία μελέτης: "+eur(bal.total)+" · Δεσμευμένα: "+eur(bal.spent)','"Συμβατική καθαρή αξία: "+eur(bal.total)+" · Δεσμευμένα: "+eur(bal.spent)'),
            ('const overQty=[];let unmapped=0;','const overQty=[];let mappingMismatch=0;'),
            ('if(c>0&&mappingCovered(it)<c-0.005)unmapped++;','if(c>0&&Math.abs(mappingCovered(it)-c)>0.005)mappingMismatch++;'),
            ('if(unmapped)balHost.append(el("div",{class:"mo-callout"},"⇄ "+(unmapped===1?"1 είδος εκτός τιμολογίου δεν έχει":unmapped+" είδη εκτός τιμολογίου δεν έχουν")+" πλήρη αντιστοίχιση — πατήστε «⇄» στη γραμμή."));','if(mappingMismatch)balHost.append(el("div",{class:"mo-callout mo-cerr"},"⇄ "+(mappingMismatch===1?"1 είδος εκτός τιμολογίου δεν έχει":mappingMismatch+" είδη εκτός τιμολογίου δεν έχουν")+" ακριβώς ίση συμβατική αξία στην «χρέωση ως» — πατήστε «⇄» στη γραμμή."));'),
            ('if(c>0&&cov<c-0.005){errs.push("Το είδος «"+it.description+"» είναι εκτός τιμολογίου — ορίστε πλήρη αντιστοίχιση (⇄).");break;}','if(c>0&&Math.abs(cov-c)>0.005){errs.push("Το είδος «"+it.description+"» είναι εκτός τιμολογίου — η «χρέωση ως» πρέπει να έχει ακριβώς ίση συμβατική αξία (⇄).");break;}'),
            ('"⛔ Αυστηρό όριο: διαθέσιμο υπόλοιπο μελέτης "+eur(bal.remaining)+", δελτίο "+eur(o.subtotal)+". Το δελτίο δεν εκδίδεται."','"⛔ Αυστηρό όριο: διαθέσιμο συμβατικό υπόλοιπο "+eur(bal.remaining)+", δελτίο "+eur(o.subtotal)+". Το δελτίο δεν εκδίδεται."'),
            ('"Το δελτίο θα λάβει αριθμό, θα δεσμεύσει ",el("b",{},eur(o.subtotal))," (καθαρά) από τη μελέτη και θα γίνει "','"Το δελτίο θα λάβει αριθμό, θα δεσμεύσει ",el("b",{},eur(o.subtotal))," (καθαρά) από τη σύμβαση και θα γίνει "'),
            ('"Υπόλοιπο μελέτης: "+eur(bal.remaining)+" → μετά την έκδοση: "+eur(after)','"Συμβατικό υπόλοιπο: "+eur(bal.remaining)+" → μετά την έκδοση: "+eur(after)'),
            ('"Με την «Έκδοση» το δελτίο λαμβάνει αριθμό, δεσμεύει το ποσό της μελέτης και γίνεται αμετάβλητο. Τυχόν διόρθωση γίνεται με αιτιολογημένη ακύρωση και νέα έκδοση."','"Με την «Έκδοση» το δελτίο λαμβάνει αριθμό, δεσμεύει το πραγματικό συμβατικό ποσό και γίνεται αμετάβλητο. Τυχόν διόρθωση γίνεται με αιτιολογημένη ακύρωση και νέα έκδοση."')
          ]
          for old,new in repls:
            if s.count(old)!=1:
              raise SystemExit(f'expected one occurrence, found {s.count(old)}: {old[:90]}')
            s=s.replace(old,new)
          inline=[m.group(1) for m in re.finditer(r'<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)</script>',s,re.I)]
          if len(inline)!=2: raise SystemExit(f'expected 2 inline scripts, got {len(inline)}')
          hashes=["'sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode()+"'" for x in inline]
          def csp(m):
            c=re.sub(r"script-src [^;]+","script-src 'self' file: "+' '.join(hashes),m.group(1),count=1)
            return '<meta http-equiv="Content-Security-Policy" content="'+c+'"'
          s,n=re.subn(r'<meta\\s+http-equiv="Content-Security-Policy"\\s+content="([^"]+)"',csp,s,count=1,flags=re.I)
          if n!=1: raise SystemExit('CSP meta not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: align order UI with actual contract financial guards"
          git push
