name: Fix Phase4 patch script
on:
  push:
    branches: [agent/v36-6-6-resilience]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-6-resilience
      - name: Fix guarded response anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_phase4_frontend.py')
          s=p.read_text(encoding='utf-8')
          old="if count<4: raise SystemExit(f'expected >=4 request_id response markers, found {count}')"
          new="if count<3: raise SystemExit(f'expected >=3 request_id response markers, found {count}')"
          if s.count(old)!=1: raise SystemExit('request marker guard anchor missing')
          s=s.replace(old,new,1)
          anchor="""s=pat.sub(lambda _:"const {data,error}=await resilientRpc('load_study_template_resilient_atomic',{\\n      p_expected_revision:reqRevision,"+body+"\\n    },'template-load:'+cur.unitId+':'+cur.groupId+':'+YEAR);",s,count=1)

pat=re.compile(r"\\(\\{error\\}=await sb\\.rpc\\('save_contract_pricing_atomic',\\{(.*?)\\n          \\}\\)\\);",re.S)"""
          replacement="""s=pat.sub(lambda _:"const {data,error}=await resilientRpc('load_study_template_resilient_atomic',{\\n      p_expected_revision:reqRevision,"+body+"\\n    },'template-load:'+cur.unitId+':'+cur.groupId+':'+YEAR);",s,count=1)
once("reqId=data&&data.request_id?data.request_id:reqId;",
     "reqId=data&&data.request_id?data.request_id:reqId;\\n    if(data&&data.revision!=null)reqRevision=Number(data.revision)||0;",'template revision response')

pat=re.compile(r"\\(\\{error\\}=await sb\\.rpc\\('save_contract_pricing_atomic',\\{(.*?)\\n          \\}\\)\\);",re.S)"""
          if s.count(anchor)!=1: raise SystemExit('template insertion anchor missing')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit script fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/apply_phase4_frontend.py
          git commit -m "fix: handle template revision response separately"
          git push origin HEAD:agent/v36-6-6-resilience
