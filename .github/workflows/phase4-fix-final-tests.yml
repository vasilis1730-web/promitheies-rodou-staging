name: Align Phase4 frontend tests
on:
  push:
    branches: [agent/v36-6-6-resilience]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-6-resilience
          fetch-depth: 0
      - name: Align current-version fixtures and resilient RPC expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          for fn in [
            'tests/award-groups.test.mjs',
            'tests/bulletins-refresh.test.mjs',
            'tests/domain-templates.test.mjs',
            'tests/empty-service-catalog.test.mjs'
          ]:
            p=Path(fn);s=p.read_text(encoding='utf-8')
            if '36.6.5' not in s: raise SystemExit(f'{fn}: current schema fixture not found')
            s=s.replace('36.6.5','36.6.6')
            p.write_text(s,encoding='utf-8')

          p=Path('tests/award-groups.test.mjs');s=p.read_text(encoding='utf-8')
          if s.count('secure_import_catalog_request_atomic')<2:
            raise SystemExit('award Excel legacy RPC fixtures not found')
          s=s.replace('secure_import_catalog_request_atomic','secure_import_catalog_request_resilient_atomic')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/step2-frontend.test.mjs');s=p.read_text(encoding='utf-8')
          replacements={
            "'save_unit_request_atomic',":"'save_unit_request_resilient_atomic',",
            "'copy_unit_request_atomic',":"'copy_unit_request_resilient_atomic',",
            "'secure_import_catalog_request_atomic',":"'secure_import_catalog_request_resilient_atomic',",
            "'lock_study_atomic',":"'lock_study_resilient_atomic',",
            "  'save_contract_atomic',\n":"",
            "'save_contract_pricing_atomic',":"'save_contract_pricing_resilient_atomic',",
            "'save_order_atomic',":"'save_order_resilient_atomic',",
            "'load_study_template_atomic',":"'load_study_template_resilient_atomic',",
            "frontend v36.6.5":"frontend v36.6.6",
            r"Προμήθειες &amp; Υπηρεσίες v36\.6\.5 CONTRACT PRICING":r"Προμήθειες &amp; Υπηρεσίες v36\.6\.6 PRODUCTION RESILIENCE",
            r"const APP_VERSION='v36\.6\.5-contract-pricing', REQUIRED_SCHEMA_VERSION='36\.6\.5'":r"const APP_VERSION='v36\.6\.6-production-resilience', REQUIRED_SCHEMA_VERSION='36\.6\.6'"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'step2 missing anchor: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit test alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/award-groups.test.mjs tests/bulletins-refresh.test.mjs tests/domain-templates.test.mjs tests/empty-service-catalog.test.mjs tests/step2-frontend.test.mjs
          git commit -m "test: align frontend fixtures with v36.6.6 resilience"
          git push origin HEAD:agent/v36-6-6-resilience
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/phase4-fix-final-tests.yml
          git commit -m "chore: remove Phase4 final test helper"
          git push origin HEAD:agent/v36-6-6-resilience
