name: Patch v36.6.5 tests
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/patch-v36-6-5-tests.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Align deterministic tests
        run: |
          python - <<'PY'
          from pathlib import Path
          patches={
            'tests/phase2-integrity-v36-6-4.test.mjs':[
              ("clean install φτάνει σε schema 36.6.4 με τα νέα integrity triggers ενεργά","clean install διατηρεί τα Phase-2 integrity triggers ενεργά στο τρέχον schema 36.6.5"),
              ("assert.equal(await scalar(db,`select public.app_schema_version()`),'36.6.4');","assert.equal(await scalar(db,`select public.app_schema_version()`),'36.6.5');")
            ],
            'tests/production-readiness-v36-6-3.test.mjs':[
              ("clean install εφαρμόζει αυτόματα ΟΛΕΣ τις migrations και φτάνει σε schema 36.6.4","clean install εφαρμόζει αυτόματα ΟΛΕΣ τις migrations και φτάνει σε schema 36.6.5"),
              ("assert.ok(migrations.includes('202608090002_v36_6_4_request_line_integrity_and_version.sql'));","assert.ok(migrations.includes('202608090002_v36_6_4_request_line_integrity_and_version.sql'));\n    assert.ok(migrations.includes('202608090003_v36_6_5_contract_pricing.sql'));"),
              ("assert.equal(await scalar(db, `select public.app_schema_version()`), '36.6.4');","assert.equal(await scalar(db, `select public.app_schema_version()`), '36.6.5');")
            ],
            'tests/phase3-financial-v36-6-5.test.mjs':[
              ("select public.save_contract_pricing_atomic($1,$2,$3,'Contract',null,null,date '2026-08-01',date '2026-08-31',24,$4,$5,$6::jsonb)","select public.save_contract_pricing_atomic($1::text,$2::text,$3::text,'Contract',null,null,date '2026-08-01',date '2026-08-31',24,$4::text,$5::numeric,$6::jsonb)")
            ]
          }
          for fn,repls in patches.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              for old,new in repls:
                  if s.count(old)!=1:
                      raise SystemExit(f'{fn}: expected 1 occurrence of {old!r}, found {s.count(old)}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase2-integrity-v36-6-4.test.mjs tests/production-readiness-v36-6-3.test.mjs tests/phase3-financial-v36-6-5.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: align clean-install assertions with v36.6.5"
          git push
