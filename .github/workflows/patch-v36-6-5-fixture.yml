name: Patch v36.6.5 fixture casts
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/patch-v36-6-5-fixture.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Patch polymorphic JSON parameters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/phase3-financial-v36-6-5.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="jsonb_build_object('material_id',$3::text,'quantity',$4,'unit_price',$5,'comments',null)"
          new="jsonb_build_object('material_id',$3::text,'quantity',$4::numeric,'unit_price',$5::numeric,'comments',null)"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one prepareStudy JSON expression, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase3-financial-v36-6-5.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: cast phase3 fixture numeric parameters"
          git push
