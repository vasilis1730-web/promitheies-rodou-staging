name: Patch CSP hash once

on:
  push:
    branches:
      - agent/v36-6-3-production-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v36-6-3-production-readiness

      - name: Patch CSP hash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'sha256-pQIp9F6QMXuSctnEGFgCeUJ207PIXdLe4Mo/t7S2E1o='
          new = 'sha256-bEDO0O5Tngmv1NuA/ODkoDNVsuof0+p8jtmo8bPlu8s='
          if s.count(old) != 1:
              raise SystemExit('Old CSP hash is not present exactly once')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: refresh CSP hash for v36.6.3'
          git push origin HEAD:agent/v36-6-3-production-readiness
