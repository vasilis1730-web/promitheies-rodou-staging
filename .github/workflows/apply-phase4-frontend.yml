name: Cleanup Phase4 temporary helpers
on:
  push:
    branches: [agent/v36-6-6-resilience]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-6-resilience
          fetch-depth: 0
      - name: Remove temporary helpers
        run: |
          git rm -f .github/workflows/apply-phase4-frontend.yml
          git rm -f .github/workflows/fix-phase4-patch-script.yml
          git rm -f .github/scripts/apply_phase4_frontend.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove Phase4 temporary helpers"
          git push origin HEAD:agent/v36-6-6-resilience
