name: Apply Phase4 resilient frontend
on:
  push:
    branches: [agent/v36-6-6-resilience]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-6-resilience
          fetch-depth: 0
      - name: Apply guarded frontend patch
        run: python .github/scripts/apply_phase4_frontend.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html package.json package-lock.json tests/login-bootstrap.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate v36.6.6 resilient client operations"
          git push origin HEAD:agent/v36-6-6-resilience
