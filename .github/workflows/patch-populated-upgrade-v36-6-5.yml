name: Patch populated v36.6.5 upgrade
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
          fetch-depth: 0
      - name: Patch migration backfill
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/202608090003_v36_6_5_contract_pricing.sql')
          s=p.read_text(encoding='utf-8')
          before="""alter table public.mo_contract_items
  add column if not exists estimated_unit_price numeric(14,4);

update public.mo_contracts c
"""
          after="""alter table public.mo_contract_items
  add column if not exists estimated_unit_price numeric(14,4);

-- Upgrade backfill: οι παλιοί immutable guards προστατεύουν σωστά το
-- συμβατικό snapshot, αλλά οι νέες στήλες πρέπει να αρχικοποιηθούν μία φορά
-- σε ήδη υπάρχουσες συμβάσεις. Απενεργοποιούνται ΜΟΝΟ οι δύο συγκεκριμένοι
-- row triggers μέσα στην ίδια transaction και επανενεργοποιούνται αμέσως
-- μετά το backfill. Αν η migration αποτύχει, η PostgreSQL κάνει rollback και
-- της κατάστασης των triggers μαζί με όλες τις υπόλοιπες DDL/DML αλλαγές.
do $$
begin
  if exists (
    select 1 from pg_trigger t
    where t.tgrelid='public.mo_contracts'::regclass
      and t.tgname='trg_mo_contracts_immutable' and not t.tgisinternal
  ) then
    alter table public.mo_contracts disable trigger trg_mo_contracts_immutable;
  end if;
  if exists (
    select 1 from pg_trigger t
    where t.tgrelid='public.mo_contract_items'::regclass
      and t.tgname='trg_mo_contract_items_immutable' and not t.tgisinternal
  ) then
    alter table public.mo_contract_items disable trigger trg_mo_contract_items_immutable;
  end if;
end;
$$;

update public.mo_contracts c
"""
          if before not in s: raise SystemExit('start anchor not found')
          s=s.replace(before,after,1)
          before2="""update public.mo_contract_items
set estimated_unit_price = coalesce(estimated_unit_price,unit_price,0)
where estimated_unit_price is null;

alter table public.mo_contracts
"""
          after2="""update public.mo_contract_items
set estimated_unit_price = coalesce(estimated_unit_price,unit_price,0)
where estimated_unit_price is null;

-- Επαναφορά των immutable guards πριν από constraints/RPCs.
do $$
begin
  if exists (
    select 1 from pg_trigger t
    where t.tgrelid='public.mo_contracts'::regclass
      and t.tgname='trg_mo_contracts_immutable' and not t.tgisinternal
  ) then
    alter table public.mo_contracts enable trigger trg_mo_contracts_immutable;
  end if;
  if exists (
    select 1 from pg_trigger t
    where t.tgrelid='public.mo_contract_items'::regclass
      and t.tgname='trg_mo_contract_items_immutable' and not t.tgisinternal
  ) then
    alter table public.mo_contract_items enable trigger trg_mo_contract_items_immutable;
  end if;
end;
$$;

alter table public.mo_contracts
"""
          if before2 not in s: raise SystemExit('end anchor not found')
          s=s.replace(before2,after2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/202608090003_v36_6_5_contract_pricing.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow one-time pricing backfill on populated upgrade"
          git push origin HEAD:agent/v36-6-5-contract-pricing
