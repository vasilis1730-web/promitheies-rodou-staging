name: Patch v36.6.5 pricing defaults
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/patch-v36-6-5-defaults.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Apply guarded defaults patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/202608090003_v36_6_5_contract_pricing.sql')
          s=p.read_text(encoding='utf-8')
          replacements={
            'alter column estimated_amount set default 0,':'alter column estimated_amount drop default,',
            'alter column estimated_unit_price set default 0,':'alter column estimated_unit_price drop default,'
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608090003_v36_6_5_contract_pricing.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix: let pricing guards populate legacy inserts"
          git push
