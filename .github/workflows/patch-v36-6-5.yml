name: Patch v36.6.5 migration
on:
  push:
    branches: [agent/v36-6-5-contract-pricing]
    paths: ['.github/workflows/patch-v36-6-5.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-5-contract-pricing
      - name: Apply guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/202608090003_v36_6_5_contract_pricing.sql')
          s=p.read_text(encoding='utf-8')
          old="v_contract_id := (v_base->>'contract_id')::public.mo_contracts.id%type;"
          new="v_contract_id := v_base->>'contract_id';"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one legacy cast, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608090003_v36_6_5_contract_pricing.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix: use valid PL/pgSQL assignment for contract id"
          git push
