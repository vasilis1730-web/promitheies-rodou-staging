name: Capture pre-70003 diagnostics

on:
  push:
    branches:
      - agent/v36-6-3-production-readiness

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'Capture pre-70003 diagnostics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-3-production-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture diagnostics
        run: node scripts/capture-pre-70003.mjs
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-pre-70003-diagnostics.json
          git commit -m 'Capture pre-70003 diagnostics'
          git push origin HEAD:agent/v36-6-3-production-readiness
