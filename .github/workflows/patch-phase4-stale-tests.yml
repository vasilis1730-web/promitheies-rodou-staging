name: Patch Phase4 stale tests
on:
  push:
    branches: [agent/v36-6-6-resilience]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v36-6-6-resilience
          fetch-depth: 0
      - name: Patch stale expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          # GO-LIVE RESET v36.6.5 is intentionally tested at its historical
          # deployment point: migrations through 202608090004 only.
          p=Path('tests/go-live-reset-v36-6-5.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="const migrations=()=>fs.readdirSync(migrationsDir).filter(x=>/^\\d+.*\\.sql$/i.test(x)).sort((a,b)=>a.localeCompare(b,'en'));"
          new="const migrations=()=>fs.readdirSync(migrationsDir).filter(x=>/^\\d+.*\\.sql$/i.test(x) && x.localeCompare('202608090005_v36_6_6_resilience.sql','en')<0).sort((a,b)=>a.localeCompare(b,'en'));"
          if old not in s: raise SystemExit('go-live migrations anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # These suites intentionally validate the current schema after ALL
          # migrations, so only their dotted current-version literal advances.
          for fn in [
            'tests/phase2-integrity-v36-6-4.test.mjs',
            'tests/phase3-financial-v36-6-5.test.mjs',
            'tests/production-readiness-v36-6-3.test.mjs'
          ]:
            p=Path(fn); s=p.read_text(encoding='utf-8')
            n=s.count('36.6.5')
            if n<2: raise SystemExit(f'{fn}: expected at least 2 current-version literals, found {n}')
            s=s.replace('36.6.5','36.6.6')
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/go-live-reset-v36-6-5.test.mjs tests/phase2-integrity-v36-6-4.test.mjs tests/phase3-financial-v36-6-5.test.mjs tests/production-readiness-v36-6-3.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: align historical and current schema expectations for v36.6.6"
          git push origin HEAD:agent/v36-6-6-resilience
