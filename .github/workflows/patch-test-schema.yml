name: Align v36.6.3 test fixtures once

on:
  push:
    branches:
      - agent/v36-6-3-production-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v36-6-3-production-readiness

      - name: Update only stale frontend schema fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture_files = [
              Path('tests/award-groups.test.mjs'),
              Path('tests/bulletins-refresh.test.mjs'),
              Path('tests/domain-templates.test.mjs'),
              Path('tests/empty-service-catalog.test.mjs'),
          ]
          replacements = 0
          for p in fixture_files:
              s = p.read_text(encoding='utf-8')
              count = s.count("'36.6.1'")
              if count < 1:
                  raise SystemExit(f'Expected at least one v36.6.1 frontend fixture in {p}')
              p.write_text(s.replace("'36.6.1'", "'36.6.3'"), encoding='utf-8')
              replacements += count

          p = Path('tests/login-bootstrap.test.mjs')
          s = p.read_text(encoding='utf-8')
          old = "REQUIRED_SCHEMA_VERSION='36\\.6\\.1'"
          new = "REQUIRED_SCHEMA_VERSION='36\\.6\\.3'"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale login schema assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          replacements += 1
          print(f'Updated {replacements} stale frontend schema-version fixtures/assertions')
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- tests; then
            echo 'Frontend test fixtures already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'test: align schema fixtures with v36.6.3'
          git push origin HEAD:agent/v36-6-3-production-readiness
