name: Finalize v36.6.4 once

on:
  push:
    branches:
      - agent/v36-6-4-phase2-integrity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v36-6-4-phase2-integrity

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update frontend, package version and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('package.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('version')!='36.6.3':
              raise SystemExit(f"Expected package version 36.6.3, got {obj.get('version')}")
          obj['version']='36.6.4'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          visible_old='v36.6.3 PRODUCTION READINESS'
          if s.count(visible_old)!=2:
              raise SystemExit(f'Expected two visible old version labels, found {s.count(visible_old)}')
          s=s.replace(visible_old,'v36.6.4 PHASE 2 INTEGRITY')

          exact={
            "APP_VERSION='v36.6.3-production-readiness'":"APP_VERSION='v36.6.4-phase2-integrity'",
            "REQUIRED_SCHEMA_VERSION='36.6.3'":"REQUIRED_SCHEMA_VERSION='36.6.4'",
          }
          for old,new in exact.items():
              if s.count(old)!=1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {s.count(old)}')
              s=s.replace(old,new)

          m=re.search(r"const COMPATIBLE_EXCEL_VERSIONS=new Set\(\[([^\]]*)\]\);",s)
          if not m:
              raise SystemExit('COMPATIBLE_EXCEL_VERSIONS declaration not found')
          inner=m.group(1)
          newver="'v36.6.4-phase2-integrity'"
          if newver not in inner:
              inner=inner.rstrip()+(',' if inner.strip() else '')+newver
              s=s[:m.start(1)]+inner+s[m.end(1):]
          p.write_text(s,encoding='utf-8')

          for p in Path('tests').glob('*.test.mjs'):
              s=p.read_text(encoding='utf-8')
              original=s
              s=s.replace("data:'36.6.3'","data:'36.6.4'")
              s=s.replace("data: '36.6.3'","data: '36.6.4'")
              s=s.replace("{ data: '36.6.3', error: null }","{ data: '36.6.4', error: null }")
              s=s.replace("REQUIRED_SCHEMA_VERSION='36\\.6\\.3'","REQUIRED_SCHEMA_VERSION='36\\.6\\.4'")
              s=s.replace("v36.6.3-production-readiness","v36.6.4-phase2-integrity")
              if s!=original:
                  p.write_text(s,encoding='utf-8')
          PY

          npm install --package-lock-only --ignore-scripts

      - name: Recompute CSP hashes from actual inline scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,hashlib,base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          scripts=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,flags=re.I|re.S):
              attrs=m.group(1)
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              body=m.group(2)
              digest=base64.b64encode(hashlib.sha256(body.encode('utf-8')).digest()).decode('ascii')
              scripts.append("'sha256-"+digest+"'")
          if not scripts:
              raise SystemExit('No inline scripts found')
          meta=re.search(r'(<meta\s+http-equiv="Content-Security-Policy"\s+content=")([^"]+)(")',s,re.I)
          if not meta:
              raise SystemExit('CSP meta not found')
          csp=meta.group(2)
          sm=re.search(r"script-src\s+([^;]+)",csp)
          if not sm:
              raise SystemExit('script-src directive not found')
          tokens=[t for t in sm.group(1).split() if not (t.startswith("'sha256-") and t.endswith("'"))]
          replacement='script-src '+' '.join(tokens+scripts)
          csp=csp[:sm.start()]+replacement+csp[sm.end():]
          s=s[:meta.start(2)]+csp+s[meta.end(2):]
          p.write_text(s,encoding='utf-8')
          print('Inline CSP hashes:',len(scripts))
          PY

      - name: Commit finalized v36.6.4 metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html package.json package-lock.json tests
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'chore: finalize frontend metadata for v36.6.4'
          git push origin HEAD:agent/v36-6-4-phase2-integrity
